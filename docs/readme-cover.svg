<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">NetPeek — Your connections, at a glance.</title>
  <desc id="description">A warm paper and mint cover with NetPeek's friendly binocular mark. Native Windows connection viewing for TCP, UDP, IPv4 and IPv6. This is cover artwork, not an application screenshot.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FCFDF9"/>
      <stop offset="1" stop-color="#EEF5EF"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="358" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#paper)"/>
    <path d="M798 0H1200V360H846Q793 274 801 190T798 0Z" fill="#E6F1EA"/>
    <path d="M792 61V299" stroke="#D2E1D5" stroke-width="2"/>
    <g font-family="Segoe UI, Arial, sans-serif" fill="#20382E">
      <text x="64" y="61" font-size="12" font-weight="600" letter-spacing="2.5" fill="#5F7168">A LITTLE CLARITY FOR YOUR CONNECTIONS</text>
      <text x="59" y="156" font-size="88" font-weight="700" letter-spacing="-3">NetPeek</text>
      <text x="64" y="208" font-size="30" font-weight="500" fill="#28684F">Your connections, at a glance.</text>
      <text x="64" y="247" font-size="17" fill="#5F7168">A small, native Windows connection viewer.</text>
      <g transform="translate(64 279)" font-size="12" font-weight="600" letter-spacing="0.7">
        <rect width="116" height="32" rx="16" fill="#E6F1EA"/>
        <text x="58" y="21" text-anchor="middle" fill="#28684F">TCP + UDP</text>
        <rect x="128" width="132" height="32" rx="16" fill="#E6F1EA"/>
        <text x="194" y="21" text-anchor="middle" fill="#28684F">IPv4 + IPv6</text>
        <rect x="272" width="156" height="32" rx="16" fill="#E6F1EA"/>
        <text x="350" y="21" text-anchor="middle" fill="#28684F">STANDARD USER</text>
      </g>
    </g>
    <g transform="translate(871 57) scale(1.8)">
      <rect x="4" y="4" width="120" height="120" rx="36" fill="#CDE5D5"/>
      <path d="M24 55 34 29Q41 21 53 37M75 37Q87 21 94 29L104 55" fill="none" stroke="#28684F" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="39" cy="76" rx="26" ry="29" fill="#F7FCF6" stroke="#28684F" stroke-width="7"/>
      <ellipse cx="89" cy="76" rx="26" ry="29" fill="#F7FCF6" stroke="#28684F" stroke-width="7"/>
      <ellipse cx="45" cy="74" rx="8" ry="10" fill="#28684F"/>
      <ellipse cx="84" cy="74" rx="8" ry="10" fill="#28684F"/>
    </g>
    <text x="986" y="319" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#5F7168">LOOK CLOSER.</text>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="24" fill="none" stroke="#DFE8E1" stroke-width="2"/>
</svg>
